name: Memora CI/CD Pipeline

# ─── Trigger on pushes & PRs to main ──────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DEBUG: "True"
  SECRET_KEY: "ci-test-secret-key-not-for-production"
  ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Lint & Syntax Validation
  # ═══════════════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python syntax check (compile all .py files)
        run: python -m compileall . -q -x venv

      - name: Check for Python import errors
        run: |
          python -c "
          import django
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'quotevault.settings')
          django.setup()
          from quotes import models, views, urls
          print('All imports OK')
          "

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Django System Checks & Migrations
  # ═══════════════════════════════════════════════════════════════════════════
  django-checks:
    name: ⚙️ Django System Checks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check (models, settings, middleware)
        run: python manage.py check

      - name: Validate migrations are consistent
        run: python manage.py migrate --run-syncdb --verbosity 0

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Seed default categories
        run: python manage.py seed_categories

      - name: Collect static files
        run: python manage.py collectstatic --noinput --verbosity 0

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Test Suite
  # ═══════════════════════════════════════════════════════════════════════════
  tests:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: django-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations for test DB
        run: python manage.py migrate --verbosity 0

      - name: Seed categories for tests
        run: python manage.py seed_categories

      - name: Run full test suite
        run: python manage.py test quotes.tests --verbosity 2

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: Deploy Readiness (only on push to main)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-ready:
    name: 🚀 Deploy Readiness
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Simulate production build
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-deploy-readiness-check-super-secret-key-2026-production-validation"
          ALLOWED_HOSTS: "*"
        run: |
          python manage.py migrate --verbosity 0
          python manage.py seed_categories
          python manage.py collectstatic --noinput --verbosity 0
          python manage.py check --deploy --fail-level WARNING

      - name: Verify Gunicorn can load the app
        run: |
          pip install gunicorn
          timeout 5 gunicorn quotevault.wsgi:application --bind 127.0.0.1:9000 --workers 1 &
          sleep 3
          curl -f http://127.0.0.1:9000/login/ || exit 1
          echo "Gunicorn startup OK — app is deployable"

      - name: ✅ All checks passed — safe to deploy
        run: echo "Pipeline complete. Render will auto-deploy this commit."
