{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dracula">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Memora Admin</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'logo.svg' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
    <link rel="shortcut icon" href="{% url 'favicon' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#0a0914">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Space Grotesk', sans-serif; }</style>
</head>
<body class="bg-[#0f0e17] text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md text-center space-y-6">
        <div class="w-16 h-16 rounded-3xl bg-red-500/10 border border-red-500/20 text-red-400 flex items-center justify-center mx-auto">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0-10.036A9 9 0 0119.5 12a9 9 0 01-15 0 9 9 0 017.5-9.286zm0 13.036h.008v.008H12v-.008z"/></svg>
        </div>

        <div>
            <h1 class="text-2xl font-bold text-white mb-2">Access Restricted</h1>
            <p class="text-xs text-white/50 leading-relaxed">
                You are currently logged in as <span class="text-purple-300 font-bold">@{{ request.user.username }}</span>. This Control Console requires Admin / Staff privileges.
            </p>
        </div>

        <div class="flex items-center justify-center gap-3">
            <a href="{% url 'dashboard' %}" class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-xs font-bold text-white transition-all">
                Back to My Vault
            </a>
            <a href="{% url 'logout' %}" class="px-5 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold text-white/70 transition-all">
                Log Out
            </a>
        </div>
    </div>
</body>
</html>
