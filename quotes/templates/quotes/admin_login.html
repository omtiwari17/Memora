{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dracula">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access — Memora Control Console</title>
    <meta name="description" content="Dedicated Admin Authentication Portal for Memora Control Console.">
    <link rel="icon" type="image/svg+xml" href="{% static 'logo.svg' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
    <link rel="shortcut icon" href="{% url 'favicon' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#0a0914">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .aurora-blob { filter: blur(120px); opacity: 0.6; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(20px, -25px) scale(1.04); }
            66% { transform: translate(-15px, 15px) scale(0.97); }
        }
        .float-1 { animation: float 16s ease-in-out infinite; }
        .float-2 { animation: float 22s ease-in-out infinite reverse; }

        .glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body class="bg-[#0f0e17] text-white min-h-screen relative overflow-x-hidden flex items-center justify-center p-4">

    <!-- Dark Aurora background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="aurora-blob float-1 absolute -top-40 -left-32 w-[500px] h-[500px] rounded-full bg-purple-600/30"></div>
        <div class="aurora-blob float-2 absolute top-1/3 -right-40 w-[550px] h-[550px] rounded-full bg-indigo-500/20"></div>
    </div>

    <div class="w-full max-w-md">
        <!-- Logo & Branding -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-950/80 to-purple-950/80 border border-amber-400/30 flex items-center justify-center shadow-xl shadow-amber-500/20 mx-auto mb-4 relative">
                <svg class="w-9 h-9" viewBox="0 0 32 32" fill="none">
                    <path d="M7 23V11.5L16 19.5L25 11.5V23" stroke="url(#log-mem-1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M11 10C11 7.79 13.24 6 16 6C18.76 6 21 7.79 21 10" stroke="url(#log-mem-2)" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="16" cy="13.5" r="1.75" fill="#f59e0b"/>
                    <defs>
                        <linearGradient id="log-mem-1" x1="7" y1="11.5" x2="25" y2="23" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#fbbf24"/>
                            <stop offset="0.5" stop-color="#c084fc"/>
                            <stop offset="1" stop-color="#818cf8"/>
                        </linearGradient>
                        <linearGradient id="log-mem-2" x1="11" y1="6" x2="21" y2="10" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#f59e0b"/>
                            <stop offset="1" stop-color="#fbbf24"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs font-bold mb-2">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                System Admin Portal
            </div>
            <h1 class="text-2xl font-bold text-white">
                Admin Control Console
            </h1>
            <p class="text-xs text-white/40 mt-1">Dedicated access for authorized staff handles</p>
        </div>

        <!-- Lock Card -->
        <div class="glass rounded-3xl p-6 sm:p-8 shadow-2xl shadow-black/50 border border-amber-500/20">

            {% if error %}
            <div class="mb-5 p-3.5 rounded-xl bg-red-500/15 border border-red-500/30 text-red-300 text-xs flex items-center gap-2">
                <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{% url 'admin_vault_login' %}" class="space-y-5">
                {% csrf_token %}

                <!-- Admin Handle -->
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-wider text-amber-300/70 block mb-1.5">Admin Handle</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 text-sm text-amber-400 font-bold select-none">@</span>
                        <input
                            type="text"
                            name="handle"
                            value="{{ handle|default:'' }}"
                            placeholder="admin"
                            class="w-full bg-white/[0.04] border border-white/10 rounded-xl pl-9 pr-4 py-3 text-sm text-white placeholder-white/20 outline-none focus:border-amber-400/50 focus:bg-white/[0.06] transition-all font-medium"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <!-- Admin Key / PIN -->
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-wider text-amber-300/70 block mb-1.5">Admin Secret Key / PIN</label>
                    <input
                        type="password"
                        name="pin"
                        placeholder="••••••"
                        class="w-full bg-white/[0.04] border border-white/10 rounded-xl px-4 py-3 text-center text-xl font-mono text-white placeholder-white/20 outline-none focus:border-amber-400/50 focus:bg-white/[0.06] transition-all"
                        required
                    >
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-600 to-purple-600 hover:from-amber-500 hover:to-purple-500 text-sm font-bold text-white shadow-xl shadow-amber-500/20 transition-all flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                    Authenticate Admin Console
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-white/[0.06] text-center">
                <a href="{% url 'login' %}" class="text-xs text-white/40 hover:text-purple-300 font-semibold transition-all inline-flex items-center gap-1.5">
                    ← Switch to Personal Memory Vault Login
                </a>
            </div>
        </div>

        <p class="text-[10px] text-white/20 text-center mt-6">
            Memora v5.0 — Control Console Portal
        </p>
    </div>

</body>
</html>
