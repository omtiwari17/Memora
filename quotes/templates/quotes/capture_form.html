{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dracula">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture — Memora</title>
    <meta name="theme-color" content="#0f0e17">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Space Grotesk', 'sans-serif'] } } } }</script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .aurora-blob { filter: blur(120px); opacity: 0.6; }
        @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -25px) scale(1.04); } }
        .float-1 { animation: float 16s ease-in-out infinite; }
        .float-2 { animation: float 22s ease-in-out infinite reverse; }
        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="bg-[#0f0e17] text-white min-h-screen relative overflow-x-hidden">
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="aurora-blob float-1 absolute -top-40 -left-32 w-[500px] h-[500px] rounded-full bg-purple-600/30"></div>
        <div class="aurora-blob float-2 absolute top-1/3 -right-40 w-[550px] h-[550px] rounded-full bg-indigo-500/20"></div>
    </div>

    <div class="max-w-xl mx-auto px-4 py-10">
        <a href="{% url 'dashboard' %}" class="inline-flex items-center gap-2 text-sm text-white/40 hover:text-white/70 transition-colors mb-8">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
            Back to Memora
        </a>

        <div class="glass rounded-3xl p-6 sm:p-8">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white/90">Capture a Memory</h1>
                    <p class="text-xs text-white/30">What do you want to remember?</p>
                </div>
            </div>

            <form method="POST" action="{% url 'capture' %}" class="space-y-4">
                {% csrf_token %}
                <textarea name="content" rows="5" placeholder="Type anything worth remembering..." class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3 text-sm text-white/90 placeholder-white/25 outline-none focus:border-purple-400/40 resize-none transition-colors" required></textarea>
                <input type="text" name="title" placeholder="Title (auto-generated if empty)" class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-white/80 placeholder-white/20 outline-none focus:border-purple-400/40 transition-colors">
                <select name="category" class="w-full bg-[#181726] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-purple-400/50 transition-colors cursor-pointer">
                    <option value="" class="bg-[#181726] text-white py-2">📥 No category (Inbox)</option>
                    {% for cat in categories %}
                    <option value="{{ cat.slug }}" class="bg-[#181726] text-white py-2">{{ cat.emoji }} {{ cat.name }}</option>
                    {% endfor %}
                </select>
                <input type="text" name="tags" placeholder="Tags (comma separated)" class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-white/80 placeholder-white/20 outline-none focus:border-purple-400/40 transition-colors">
                <input type="url" name="source_url" placeholder="URL (optional)" class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-white/80 placeholder-white/20 outline-none focus:border-purple-400/40 transition-colors">
                <select name="priority" class="w-full bg-[#181726] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-purple-400/50 transition-colors cursor-pointer">
                    <option value="none" class="bg-[#181726] text-white py-2">⚪ No priority</option>
                    <option value="low" class="bg-[#181726] text-white py-2">🟢 Low</option>
                    <option value="medium" class="bg-[#181726] text-white py-2">🟡 Medium</option>
                    <option value="high" class="bg-[#181726] text-white py-2">🟠 High</option>
                    <option value="urgent" class="bg-[#181726] text-white py-2">🔴 Urgent</option>
                </select>
                <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-sm font-semibold shadow-lg shadow-purple-500/25 hover:shadow-purple-500/40 hover:-translate-y-0.5 transition-all active:translate-y-0">
                    Save Memory
                </button>
            </form>
        </div>
    </div>
</body>
</html>
