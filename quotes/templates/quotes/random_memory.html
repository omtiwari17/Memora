{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dracula">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Memory — Memora</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'logo.svg' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
    <link rel="shortcut icon" href="{% url 'favicon' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#0a0914">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Space Grotesk', 'sans-serif'] } } } }</script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .aurora-blob { filter: blur(120px); opacity: 0.6; }
        @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(20px, -25px) scale(1.04); } }
        .float-1 { animation: float 16s ease-in-out infinite; }
        .float-2 { animation: float 22s ease-in-out infinite reverse; }
        .float-3 { animation: float 19s ease-in-out infinite 3s; }
        .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
        @keyframes fade-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fade-in 0.5s ease-out both; }
        .code-card { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-[#0f0e17] text-white min-h-screen relative overflow-x-hidden">
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="aurora-blob float-1 absolute -top-40 -left-32 w-[500px] h-[500px] rounded-full bg-purple-600/30"></div>
        <div class="aurora-blob float-2 absolute top-1/3 -right-40 w-[550px] h-[550px] rounded-full bg-indigo-500/20"></div>
        <div class="aurora-blob float-3 absolute bottom-0 left-1/4 w-[450px] h-[450px] rounded-full bg-fuchsia-600/20"></div>
    </div>

    <div class="max-w-xl mx-auto px-4 py-10">
        <a href="{% url 'dashboard' %}" class="inline-flex items-center gap-2 text-sm text-white/40 hover:text-white/70 transition-colors mb-8">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
            Back to Memora
        </a>

        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-indigo-500/15 border border-indigo-500/30 text-indigo-400 flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l-3 3m3-3l3 3"/></svg>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-white via-indigo-100 to-purple-200 bg-clip-text text-transparent mb-1">Random Memory</h1>
            <p class="text-xs text-white/30">A glimpse into your past captures</p>
        </div>

        <div id="random-content">
            {% include "quotes/partials/random_memory.html" %}
        </div>

        <div class="text-center mt-6">
            <button hx-get="{% url 'random_memory' %}" hx-target="#random-content" hx-swap="innerHTML" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl glass text-xs font-semibold text-white/70 hover:text-white hover:bg-white/[0.08] transition-all border border-white/10">
                <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
                Show Another Memory
            </button>
        </div>
    </div>
</body>
</html>
