{# Reusable Quick Capture Modal #}
<div id="capture-overlay" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/80 backdrop-blur-xl transition-opacity" onclick="closeCapture()"></div>

    <!-- Modal Card -->
    <div class="relative w-full max-w-xl max-h-[90vh] flex flex-col rounded-3xl bg-[#131124]/95 border border-white/10 shadow-[0_0_60px_rgba(168,85,247,0.2)] backdrop-blur-2xl overflow-hidden my-auto z-10 transition-all duration-300">
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-white/[0.08] shrink-0 bg-[#0f0e17]/60">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center shadow-md shadow-purple-500/25">
                    <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                </div>
                <div>
                    <span class="text-sm font-bold text-white/95 leading-tight block">Quick Capture</span>
                    <span class="text-[10px] text-white/40 leading-tight block">Save thought, task, quote, link, or media</span>
                </div>
            </div>
            <button onclick="closeCapture()" class="p-1.5 rounded-xl hover:bg-white/10 transition-colors text-white/40 hover:text-white cursor-pointer" title="Close (Esc)">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Form -->
        <form id="capture-form" hx-post="{% url 'capture' %}" hx-target="#capture-feedback" hx-swap="innerHTML" hx-on::after-request="onCaptureSuccess(event)" class="flex flex-col flex-1 overflow-hidden">
            {% csrf_token %}
            <!-- Scrollable Content Body -->
            <div class="px-6 py-4 space-y-4 overflow-y-auto flex-1 max-h-[calc(85vh-120px)]">
                <!-- Content -->
                <div>
                    <textarea
                        name="content"
                        id="capture-content"
                        rows="4"
                        placeholder="What do you want to remember?"
                        class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3 text-sm text-white/90 placeholder-white/25 outline-none focus:border-purple-400/40 resize-none transition-colors"
                        required
                        oninput="onContentChange(this.value)"
                    ></textarea>
                </div>

                <!-- Category suggestion -->
                <div id="category-suggestion" class="hidden"></div>

                <!-- Collapsed optional fields -->
                <div id="optional-fields" class="hidden space-y-3">
                    <input type="text" name="title" id="capture-title" placeholder="Title (auto-generated if empty)" class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-white/80 placeholder-white/20 outline-none focus:border-purple-400/40 transition-colors" oninput="userEditedTitle = true">

                    <select name="category" id="capture-category" class="w-full bg-[#181726] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-purple-400/50 transition-colors appearance-none cursor-pointer" style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22rgba(255,255,255,0.6)%22 stroke-width=%222%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 12px center;">
                        <option value="" class="bg-[#181726] text-white py-2">No category (Inbox)</option>
                        {% for cat in categories %}
                        <option value="{{ cat.slug }}" class="bg-[#181726] text-white py-2" {% if filter_value == cat.slug %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>

                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label class="text-[10px] text-white/40 uppercase font-semibold block">Tags</label>
                            {% if all_tags %}
                            <span class="text-[10px] text-purple-300/60 font-medium">Type or select existing tags</span>
                            {% endif %}
                        </div>
                        <input type="text" name="tags" id="capture-tags-input" list="modal-existing-tags" placeholder="comma, separated, tags (e.g. movie, code)" 
                            class="w-full h-11 bg-[#181726] border border-white/10 rounded-xl px-4 text-sm text-white placeholder-white/20 outline-none focus:border-purple-500/50 transition-colors"
                            oninput="onTagInput(this.value, 'modal-tag-suggestions')" autocomplete="off">
                        <datalist id="modal-existing-tags">
                            {% for tag in all_tags %}
                            <option value="{{ tag.name }}"></option>
                            {% endfor %}
                        </datalist>
                        {% if all_tags %}
                        <div id="modal-tag-suggestions" class="flex flex-wrap gap-1.5 mt-2 max-h-24 overflow-y-auto">
                            {% for tag in all_tags %}
                            <button type="button" onclick="addTagToInput('capture-tags-input', '{{ tag.name }}', 'modal-tag-suggestions')" 
                                data-tag="{{ tag.name|lower }}"
                                class="tag-chip-btn px-2.5 py-1 rounded-lg bg-purple-500/10 hover:bg-purple-500/25 border border-purple-500/20 text-purple-300 text-xs transition-all flex items-center gap-1">
                                <span>#{{ tag.name }}</span>
                            </button>
                            {% endfor %}
                        </div>
                        {% endif %}
                    </div>

                    <div>
                        <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1.5">Author</label>
                        <input type="text" name="author" placeholder="Author name (for quotes)" class="w-full h-11 bg-[#181726] border border-white/10 rounded-xl px-4 text-sm text-white placeholder-white/20 outline-none focus:border-purple-500/50 transition-colors">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1.5">Priority</label>
                            <select name="priority" class="w-full h-11 bg-[#181726] border border-white/10 rounded-xl px-3 text-sm text-white outline-none focus:border-purple-500/50 transition-colors">
                                <option value="none">None</option>
                                <option value="low">Low</option>
                                <option value="medium">Medium</option>
                                <option value="high">High</option>
                                <option value="urgent">Urgent</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1.5">Due Date</label>
                            <input type="date" name="due_date" class="w-full h-11 bg-[#181726] border border-white/10 rounded-xl px-3 text-sm text-white outline-none focus:border-purple-500/50 transition-colors [color-scheme:dark]">
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1.5">Source URL</label>
                        <input type="url" name="source_url" placeholder="https://..." class="w-full h-11 bg-[#181726] border border-white/10 rounded-xl px-4 text-sm text-white placeholder-white/20 outline-none focus:border-purple-500/50 transition-colors">
                    </div>
                </div>

                <!-- Toggle optional fields -->
                <button type="button" onclick="toggleOptionalFields()" id="toggle-fields-btn" class="text-xs text-white/30 hover:text-white/50 transition-colors flex items-center gap-1">
                    <svg class="w-3 h-3" id="toggle-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    More options
                </button>
            </div>

            <!-- Footer (Pinned at bottom of modal) -->
            <div class="flex items-center justify-between px-6 py-3.5 border-t border-white/[0.08] bg-[#0f0e17]/80 shrink-0">
                <div class="flex items-center gap-2">
                    <div id="capture-feedback" class="text-xs text-white/40"></div>
                    <span class="text-[11px] text-white/30 hidden sm:inline-flex items-center gap-1.5 font-mono">
                        <kbd class="px-1.5 py-0.5 rounded bg-white/5 border border-white/10 text-[10px]">Ctrl+Enter</kbd> to save
                    </span>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="closeCapture()" class="px-4 py-2 rounded-xl text-xs text-white/40 hover:text-white/80 hover:bg-white/5 transition-all cursor-pointer">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 via-fuchsia-600 to-indigo-600 text-xs font-bold text-white shadow-lg shadow-purple-500/25 hover:shadow-purple-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all cursor-pointer">
                        Save Memory
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
let userEditedTitle = false;

function generateLiveTitle(val) {
    if (userEditedTitle) return;
    const titleInput = document.getElementById('capture-title');
    if (!titleInput) return;
    if (!val || !val.trim()) {
        titleInput.value = '';
        return;
    }
    let clean = val.trim();

    // 1. Author quote extraction (e.g. - Benjamin Franklin)
    const authorMatch = clean.match(/[\n\r\s]+[-—–~]\s*([A-Z][a-zA-Z\s\.]+)/);
    if (authorMatch && authorMatch[1]) {
        const author = authorMatch[1].trim();
        const quoteText = clean.split('\n')[0].replace(/["“”']/g, '').trim();
        const words = quoteText.split(/\s+/);
        const shortQuote = words.length > 5 ? words.slice(0, 5).join(' ') + '...' : quoteText;
        titleInput.value = `"${shortQuote}" — ${author}`;
        return;
    }

    // 2. HTML title tag extraction
    const titleMatch = clean.match(/<title>(.*?)<\/title>/i);
    if (titleMatch && titleMatch[1]) {
        titleInput.value = titleMatch[1].trim().slice(0, 80);
        return;
    }

    // 3. Short 8-word summary
    let firstLine = clean.split('\n')[0].trim();
    firstLine = firstLine.replace(/^[“"'`\s\-*\d\.]+/g, '').replace(/[”"'`\s]+$/g, '').trim();
    if (!firstLine) firstLine = clean.slice(0, 80);
    
    const words = firstLine.split(/\s+/);
    titleInput.value = words.length > 8 ? words.slice(0, 8).join(' ') + '...' : firstLine;
}

function openCapture(catSlug) {
    const el = document.getElementById('capture-overlay');
    if (el) {
        el.classList.remove('hidden');
        if (catSlug) {
            const fields = document.getElementById('optional-fields');
            if (fields) fields.classList.remove('hidden');
            const catSelect = document.getElementById('capture-category');
            if (catSelect) catSelect.value = catSlug;
        }
        document.getElementById('capture-content').focus();
        document.body.style.overflow = 'hidden';
    }
}
function closeCapture() {
    const el = document.getElementById('capture-overlay');
    if (el) {
        el.classList.add('hidden');
        document.body.style.overflow = '';
    }
}
function toggleOptionalFields() {
    const fields = document.getElementById('optional-fields');
    const icon = document.getElementById('toggle-icon');
    const btn = document.getElementById('toggle-fields-btn');
    if (fields.classList.contains('hidden')) {
        fields.classList.remove('hidden');
        icon.style.transform = 'rotate(180deg)';
        btn.childNodes[btn.childNodes.length - 1].textContent = ' Less options';
    } else {
        fields.classList.add('hidden');
        icon.style.transform = '';
        btn.childNodes[btn.childNodes.length - 1].textContent = ' More options';
    }
}

let suggestTimeout = null;
function onContentChange(value) {
    generateLiveTitle(value);
    suggestCategory(value);
    clearTimeout(suggestTimeout);
    if (value.trim().length < 5) {
        document.getElementById('category-suggestion').classList.add('hidden');
        return;
    }
    suggestTimeout = setTimeout(() => {
        fetch(`{% url 'suggest_category' %}?content=${encodeURIComponent(value)}`)
            .then(r => r.json())
            .then(data => {
                const el = document.getElementById('category-suggestion');
                const catSelect = document.getElementById('capture-category');
                if (data.suggestion) {
                    if (catSelect) catSelect.value = data.suggestion.slug;
                    el.innerHTML = `
                        <div class="slide-up flex items-center gap-2 px-3 py-2 rounded-xl bg-purple-500/15 border border-purple-500/30">
                            <span class="text-xs font-semibold text-purple-300">✨ Auto-categorized as:</span>
                            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-purple-500/25 text-xs font-semibold text-purple-200">
                                ${data.suggestion.emoji} ${data.suggestion.name}
                            </span>
                        </div>
                    `;
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                    if (catSelect) {
                        catSelect.value = "{% if active_filter == 'category' %}{{ filter_value }}{% else %}{% endif %}";
                    }
                }
            });
    }, 250);
}

function acceptSuggestion(slug) {
    const fields = document.getElementById('optional-fields');
    fields.classList.remove('hidden');
    document.getElementById('capture-category').value = slug;
    document.getElementById('category-suggestion').classList.add('hidden');
}

function dismissSuggestion() {
    document.getElementById('category-suggestion').classList.add('hidden');
}

function onCaptureSuccess(event) {
    if (event.detail.successful) {
        document.getElementById('capture-form').reset();
        document.getElementById('optional-fields').classList.add('hidden');
        document.getElementById('category-suggestion').classList.add('hidden');
        userEditedTitle = false;

        // Remove empty state banner if present
        const emptyStates = document.querySelectorAll('#memory-stream > .col-span-full, #memory-grid > .col-span-full');
        emptyStates.forEach(el => el.remove());

        setTimeout(() => {
            closeCapture();
            const feedback = document.getElementById('capture-feedback');
            if (feedback) feedback.innerHTML = '';
        }, 500);
    }
}

document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        openCapture();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        const overlay = document.getElementById('capture-overlay');
        if (overlay && !overlay.classList.contains('hidden')) {
            e.preventDefault();
            document.getElementById('capture-form')?.requestSubmit();
        }
    }
    if (e.key === 'Escape') {
        closeCapture();
    }
});

function suggestCategory(text) {
    const categorySelect = document.getElementById('capture-category');
    if (!categorySelect || categorySelect.value) return; // Don't override if user already selected
    
    // Existing regex checks for code/quotes/links
    if (text.match(/```[\s\S]*```/)) { categorySelect.value = 'code'; return; }
    if (text.match(/https?:\/\/[^\s]+/)) { categorySelect.value = 'links'; return; }
    if (text.match(/^"[\s\S]*"$/) || text.match(/[\n\r\s]+[-—–~]\s*[A-Z]/)) { categorySelect.value = 'quotes'; return; }

    // Keyword-based suggestions
    const keywords = {
        'tasks': ['todo', 'task', 'need to', 'don\'t forget', 'remember to', 'must', 'should'],
        'watch': ['watch', 'movie', 'film', 'series', 'episode', 'netflix', 'youtube'],
        'read': ['read', 'book', 'article', 'paper', 'chapter', 'novel'],
        'buy': ['buy', 'purchase', 'order', 'shopping', 'price', '₹', '$'],
        'places': ['visit', 'travel', 'restaurant', 'cafe', 'hotel', 'airport', 'trip'],
        'ideas': ['what if', 'idea', 'concept', 'maybe', 'brainstorm'],
        'learn': ['learn', 'study', 'tutorial', 'course', 'how to', 'guide'],
        'reminders': ['reminder', 'appointment', 'meeting', 'deadline', 'schedule'],
    };
    const lower = text.toLowerCase();
    for (const [slug, words] of Object.entries(keywords)) {
        if (words.some(w => lower.includes(w))) {
            const opt = categorySelect.querySelector(`option[value="${slug}"]`);
            if (opt) { categorySelect.value = slug; return; }
        }
    }
}
function onTagInput(value, suggestionsId) {
    const box = document.getElementById(suggestionsId);
    if (!box) return;
    const parts = value.split(',').map(s => s.trim().toLowerCase());
    const currentWord = parts[parts.length - 1];
    const buttons = box.querySelectorAll('.tag-chip-btn');
    
    buttons.forEach(btn => {
        const tagName = btn.getAttribute('data-tag');
        if (parts.includes(tagName)) {
            btn.classList.add('opacity-40');
        } else {
            btn.classList.remove('opacity-40');
        }
        if (!currentWord || tagName.includes(currentWord)) {
            btn.classList.remove('hidden');
        } else {
            btn.classList.add('hidden');
        }
    });
}

function addTagToInput(inputId, tagName, suggestionsId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const parts = input.value.split(',').map(s => s.trim()).filter(Boolean);
    if (!parts.map(p => p.toLowerCase()).includes(tagName.toLowerCase())) {
        parts.push(tagName);
    }
    input.value = parts.join(', ') + ', ';
    if (suggestionsId) onTagInput(input.value, suggestionsId);
    input.focus();
}
</script>
