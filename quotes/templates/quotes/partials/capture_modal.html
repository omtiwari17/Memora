{# Reusable Quick Capture Modal #}
<div id="capture-overlay" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/70 backdrop-blur-md" onclick="closeCapture()"></div>

    <!-- Modal Card -->
    <div class="relative w-full max-w-xl max-h-[90vh] flex flex-col modal-glass rounded-3xl shadow-2xl shadow-black/50 overflow-hidden my-auto z-10">
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-white/[0.06] shrink-0 bg-[#0f0e17]/40">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                </div>
                <span class="text-sm font-semibold text-white/80">Quick Capture</span>
            </div>
            <button onclick="closeCapture()" class="p-1.5 rounded-lg hover:bg-white/10 transition-colors text-white/40 hover:text-white/70">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Form -->
        <form id="capture-form" hx-post="{% url 'capture' %}" hx-target="#capture-feedback" hx-swap="innerHTML" hx-on::after-request="onCaptureSuccess(event)" class="flex flex-col flex-1 overflow-hidden">
            {% csrf_token %}
            <!-- Scrollable Content Body -->
            <div class="px-6 py-4 space-y-4 overflow-y-auto flex-1 max-h-[calc(85vh-120px)]">
                <!-- Content -->
                <div>
                    <textarea
                        name="content"
                        id="capture-content"
                        rows="4"
                        placeholder="What do you want to remember?"
                        class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3 text-sm text-white/90 placeholder-white/25 outline-none focus:border-purple-400/40 resize-none transition-colors"
                        required
                        oninput="onContentChange(this.value)"
                    ></textarea>
                </div>

                <!-- Category suggestion -->
                <div id="category-suggestion" class="hidden"></div>

                <!-- Collapsed optional fields -->
                <div id="optional-fields" class="hidden space-y-3">
                    <input type="text" name="title" placeholder="Title (auto-generated if empty)" class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-white/80 placeholder-white/20 outline-none focus:border-purple-400/40 transition-colors">

                    <select name="category" id="capture-category" class="w-full bg-[#181726] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-purple-400/50 transition-colors appearance-none cursor-pointer" style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22rgba(255,255,255,0.6)%22 stroke-width=%222%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 12px center;">
                        <option value="" class="bg-[#181726] text-white py-2">📥 No category (Inbox)</option>
                        {% for cat in categories %}
                        <option value="{{ cat.slug }}" class="bg-[#181726] text-white py-2" {% if filter_value == cat.slug %}selected{% endif %}>{{ cat.emoji }} {{ cat.name }}</option>
                        {% endfor %}
                    </select>

                    <input type="text" name="tags" placeholder="Tags (comma separated)" class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-white/80 placeholder-white/20 outline-none focus:border-purple-400/40 transition-colors">
                    <input type="url" name="source_url" placeholder="URL (optional)" class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-white/80 placeholder-white/20 outline-none focus:border-purple-400/40 transition-colors">

                    <select name="priority" class="w-full bg-[#181726] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-purple-400/50 transition-colors appearance-none cursor-pointer" style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22rgba(255,255,255,0.6)%22 stroke-width=%222%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 12px center;">
                        <option value="none" class="bg-[#181726] text-white py-2">⚪ No priority</option>
                        <option value="low" class="bg-[#181726] text-white py-2">🟢 Low</option>
                        <option value="medium" class="bg-[#181726] text-white py-2">🟡 Medium</option>
                        <option value="high" class="bg-[#181726] text-white py-2">🟠 High</option>
                        <option value="urgent" class="bg-[#181726] text-white py-2">🔴 Urgent</option>
                    </select>
                </div>

                <!-- Toggle optional fields -->
                <button type="button" onclick="toggleOptionalFields()" id="toggle-fields-btn" class="text-xs text-white/30 hover:text-white/50 transition-colors flex items-center gap-1">
                    <svg class="w-3 h-3" id="toggle-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    More options
                </button>
            </div>

            <!-- Footer (Pinned at bottom of modal) -->
            <div class="flex items-center justify-between px-6 py-3.5 border-t border-white/[0.06] bg-[#0f0e17]/80 shrink-0">
                <div id="capture-feedback" class="text-xs text-white/30"></div>
                <div class="flex gap-2">
                    <button type="button" onclick="closeCapture()" class="px-4 py-2 rounded-xl text-xs text-white/40 hover:text-white/60 hover:bg-white/5 transition-all">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-xs font-semibold shadow-lg shadow-purple-500/20 hover:shadow-purple-500/35 hover:-translate-y-0.5 transition-all active:translate-y-0">
                        Save Memory
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
function openCapture() {
    const el = document.getElementById('capture-overlay');
    if (el) {
        el.classList.remove('hidden');
        document.getElementById('capture-content').focus();
        document.body.style.overflow = 'hidden';
    }
}
function closeCapture() {
    const el = document.getElementById('capture-overlay');
    if (el) {
        el.classList.add('hidden');
        document.body.style.overflow = '';
    }
}
function toggleOptionalFields() {
    const fields = document.getElementById('optional-fields');
    const icon = document.getElementById('toggle-icon');
    const btn = document.getElementById('toggle-fields-btn');
    if (fields.classList.contains('hidden')) {
        fields.classList.remove('hidden');
        icon.style.transform = 'rotate(180deg)';
        btn.childNodes[btn.childNodes.length - 1].textContent = ' Less options';
    } else {
        fields.classList.add('hidden');
        icon.style.transform = '';
        btn.childNodes[btn.childNodes.length - 1].textContent = ' More options';
    }
}

let suggestTimeout = null;
function onContentChange(value) {
    clearTimeout(suggestTimeout);
    if (value.trim().length < 5) {
        document.getElementById('category-suggestion').classList.add('hidden');
        return;
    }
    suggestTimeout = setTimeout(() => {
        fetch(`{% url 'suggest_category' %}?content=${encodeURIComponent(value)}`)
            .then(r => r.json())
            .then(data => {
                const el = document.getElementById('category-suggestion');
                if (data.suggestion) {
                    el.innerHTML = `
                        <div class="slide-up flex items-center gap-2 px-3 py-2 rounded-xl bg-purple-500/10 border border-purple-500/20">
                            <span class="text-xs text-purple-300">Suggested:</span>
                            <button type="button" onclick="acceptSuggestion('${data.suggestion.slug}')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-purple-500/20 text-xs text-purple-200 hover:bg-purple-500/30 transition-colors">
                                ${data.suggestion.emoji} ${data.suggestion.name}
                            </button>
                            <button type="button" onclick="dismissSuggestion()" class="ml-auto text-white/20 hover:text-white/40 text-xs">✕</button>
                        </div>
                    `;
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });
    }, 600);
}

function acceptSuggestion(slug) {
    const fields = document.getElementById('optional-fields');
    fields.classList.remove('hidden');
    document.getElementById('capture-category').value = slug;
    document.getElementById('category-suggestion').classList.add('hidden');
}

function dismissSuggestion() {
    document.getElementById('category-suggestion').classList.add('hidden');
}

function onCaptureSuccess(event) {
    if (event.detail.successful) {
        document.getElementById('capture-form').reset();
        document.getElementById('optional-fields').classList.add('hidden');
        document.getElementById('category-suggestion').classList.add('hidden');
        setTimeout(() => {
            closeCapture();
            window.location.reload();
        }, 800);
    }
}

document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        openCapture();
    }
    if (e.key === 'Escape') {
        closeCapture();
    }
});
</script>
