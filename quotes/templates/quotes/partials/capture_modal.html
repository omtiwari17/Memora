{# Reusable Quick Capture Modal #}
<div id="capture-overlay" class="fixed inset-0 z-50 hidden flex items-center justify-center p-2.5 sm:p-6 overflow-hidden">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/80 backdrop-blur-xl transition-opacity" onclick="closeCapture()"></div>

    <!-- Modal Card -->
    <div class="relative w-full max-w-lg max-h-[90vh] flex flex-col rounded-2xl sm:rounded-3xl bg-[#121020]/95 border border-white/10 shadow-[0_25px_60px_rgba(0,0,0,0.85),0_0_50px_rgba(168,85,247,0.15)] backdrop-blur-2xl overflow-hidden my-auto z-10 transition-all duration-300">
        <style>
        #capture-modal-body::-webkit-scrollbar { width: 5px; }
        #capture-modal-body::-webkit-scrollbar-track { background: transparent; }
        #capture-modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 9999px; }
        #capture-modal-body::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
        </style>

        <!-- Header -->
        <div class="flex items-center justify-between px-4 sm:px-6 py-3 sm:py-4 border-b border-white/[0.08] shrink-0 bg-[#0c0b16]/70">
            <div class="flex items-center gap-2.5 sm:gap-3">
                <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center shadow-md shadow-purple-500/25 shrink-0">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                </div>
                <div>
                    <span class="text-sm font-bold text-white/95 leading-tight block">Quick Capture</span>
                    <span class="text-[10px] text-white/40 leading-tight block">Save thought, task, quote, link, or media</span>
                </div>
            </div>
            <button type="button" onclick="closeCapture()" class="p-1.5 rounded-xl hover:bg-white/10 transition-colors text-white/40 hover:text-white cursor-pointer" title="Close (Esc)">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Form -->
        <form id="capture-form" hx-post="{% url 'capture' %}" hx-target="#capture-feedback" hx-swap="innerHTML" hx-on::after-request="onCaptureSuccess(event)" class="flex flex-col flex-1 overflow-hidden">
            {% csrf_token %}
            <!-- Scrollable Content Body -->
            <div id="capture-modal-body" class="px-4 sm:px-6 py-3.5 sm:py-4 space-y-3 sm:space-y-3.5 overflow-y-auto flex-1 max-h-[calc(90vh-125px)]" style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent;">
                
                <!-- 1. Title Input (On Top) -->
                <div>
                    <label class="text-[10px] uppercase font-bold text-white/40 tracking-wider flex items-center justify-between mb-1.5">
                        <span>Title</span>
                        <span class="text-[10px] text-white/30 font-normal lowercase">optional &bull; auto-generates if empty</span>
                    </label>
                    <input type="text"
                        name="title"
                        id="capture-title"
                        placeholder="Give this memory a title..."
                        class="w-full bg-[#18162b] hover:bg-[#1d1a33] focus:bg-[#1d1a33] border border-white/10 focus:border-purple-400/60 rounded-xl px-3.5 py-2.5 text-sm font-medium text-white placeholder-white/25 outline-none transition-all shadow-inner"
                        oninput="userEditedTitle = true">
                </div>

                <!-- 2. Memory Content Area -->
                <div>
                    <label class="text-[10px] uppercase font-bold text-white/40 tracking-wider flex items-center justify-between mb-1.5">
                        <span>Memory Content <span class="text-purple-400">*</span></span>
                    </label>
                    <textarea
                        name="content"
                        id="capture-content"
                        rows="4"
                        placeholder="What do you want to remember? Notes, thoughts, quotes, links, tasks, code..."
                        class="w-full bg-[#18162b] hover:bg-[#1d1a33] focus:bg-[#1d1a33] border border-white/10 focus:border-purple-400/60 rounded-xl p-3.5 text-sm text-white/95 placeholder-white/25 outline-none resize-none transition-all focus:ring-1 focus:ring-purple-500/20 leading-relaxed shadow-inner"
                        required
                        oninput="onContentChange(this.value)"
                    ></textarea>
                </div>

                <!-- 3. Category suggestion badge -->
                <div id="category-suggestion" class="hidden"></div>

                <!-- 4. Properties Grid: Category, Priority, Due Date -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
                    <div>
                        <label class="text-[10px] uppercase font-bold text-white/40 tracking-wider block mb-1.5">Category</label>
                        <select name="category" id="capture-category" class="w-full bg-[#18162b] border border-white/10 hover:border-white/20 rounded-xl px-3 py-2 text-xs text-white/90 outline-none focus:border-purple-400/60 transition-all cursor-pointer min-h-[38px]">
                            <option value="" class="bg-[#18162b] text-white">Inbox (Default)</option>
                            {% for cat in categories %}
                            <option value="{{ cat.slug }}" class="bg-[#18162b] text-white" {% if filter_value == cat.slug %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="text-[10px] uppercase font-bold text-white/40 tracking-wider block mb-1.5">Priority</label>
                        <select name="priority" id="capture-priority" class="w-full bg-[#18162b] border border-white/10 hover:border-white/20 rounded-xl px-3 py-2 text-xs text-white/90 outline-none focus:border-purple-400/60 transition-all cursor-pointer min-h-[38px]">
                            <option value="none" class="bg-[#18162b] text-white">None</option>
                            <option value="low" class="bg-[#18162b] text-white">Low</option>
                            <option value="medium" class="bg-[#18162b] text-white">Medium</option>
                            <option value="high" class="bg-[#18162b] text-white">High</option>
                            <option value="urgent" class="bg-[#18162b] text-white">Urgent ⚡</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[10px] uppercase font-bold text-white/40 tracking-wider block mb-1.5">Due Date</label>
                        <input type="date" name="due_date" id="capture-due-date" class="w-full bg-[#18162b] border border-white/10 hover:border-white/20 rounded-xl px-2.5 py-2 text-xs text-white/90 outline-none focus:border-purple-400/60 transition-all [color-scheme:dark] min-h-[38px]">
                    </div>
                </div>

                <!-- 5. Collapsible More Details (Tags, Author, Source URL) -->
                <div class="pt-1">
                    <button type="button" onclick="toggleCaptureDetails()" id="toggle-details-btn" class="inline-flex items-center gap-1.5 text-xs text-purple-300/70 hover:text-purple-300 transition-colors py-1 cursor-pointer font-medium">
                        <svg class="w-3.5 h-3.5 transition-transform duration-200" id="toggle-details-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                        <span>Add tags, author, or link</span>
                    </button>

                    <div id="capture-more-details" class="hidden space-y-3 pt-2.5">
                        <!-- Tags input -->
                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <label class="text-[10px] uppercase font-bold text-white/40 tracking-wider block">Tags</label>
                                {% if all_tags %}
                                <span class="text-[10px] text-purple-300/60 font-medium">Click chip or type tags</span>
                                {% endif %}
                            </div>
                            <input type="text" name="tags" id="capture-tags-input" list="modal-existing-tags" placeholder="e.g. design, react, movie (comma separated)" 
                                class="w-full bg-[#18162b] border border-white/10 rounded-xl px-3 py-2 text-xs text-white/90 placeholder-white/20 outline-none focus:border-purple-400/60 transition-all"
                                oninput="onTagInput(this.value, 'modal-tag-suggestions')" autocomplete="off">
                            <datalist id="modal-existing-tags">
                                {% for tag in all_tags %}
                                <option value="{{ tag.name }}"></option>
                                {% endfor %}
                            </datalist>
                            {% if all_tags %}
                            <div id="modal-tag-suggestions" class="flex flex-wrap gap-1.5 mt-2 max-h-20 overflow-y-auto" style="scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;">
                                {% for tag in all_tags %}
                                <button type="button" onclick="addTagToInput('capture-tags-input', '{{ tag.name }}', 'modal-tag-suggestions')" 
                                    data-tag="{{ tag.name|lower }}"
                                    class="tag-chip-btn px-2.5 py-1 rounded-lg bg-purple-500/10 hover:bg-purple-500/25 border border-purple-500/20 text-purple-300 text-xs transition-all flex items-center gap-1 cursor-pointer">
                                    <span>#{{ tag.name }}</span>
                                </button>
                                {% endfor %}
                            </div>
                            {% endif %}
                        </div>

                        <!-- Author & Source URL -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <div>
                                <label class="text-[10px] uppercase font-bold text-white/40 tracking-wider block mb-1">Author</label>
                                <input type="text" name="author" placeholder="Author name (for quotes)" class="w-full bg-[#18162b] border border-white/10 rounded-xl px-3 py-2 text-xs text-white/90 placeholder-white/20 outline-none focus:border-purple-400/60 transition-all">
                            </div>
                            <div>
                                <label class="text-[10px] uppercase font-bold text-white/40 tracking-wider block mb-1">Source URL</label>
                                <input type="url" name="source_url" placeholder="https://..." class="w-full bg-[#18162b] border border-white/10 rounded-xl px-3 py-2 text-xs text-white/90 placeholder-white/20 outline-none focus:border-purple-400/60 transition-all">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Footer (Pinned at bottom of modal) -->
            <div class="flex items-center justify-between px-4 sm:px-6 py-3 sm:py-3.5 border-t border-white/[0.08] bg-[#0c0b16]/90 shrink-0">
                <div class="flex items-center gap-2 min-w-0 mr-2">
                    <div id="capture-feedback" class="text-xs text-white/40 font-medium truncate"></div>
                    <span class="text-[11px] text-white/35 hidden sm:inline-flex items-center gap-1 font-mono shrink-0">
                        <kbd class="px-1.5 py-0.5 rounded bg-white/5 border border-white/10 text-[10px]">Ctrl+Enter</kbd> to save
                    </span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button type="button" onclick="closeCapture()" class="px-3.5 sm:px-4 py-2 rounded-xl text-xs text-white/40 hover:text-white/80 hover:bg-white/5 transition-all cursor-pointer">Cancel</button>
                    <button type="submit" class="px-4 sm:px-5 py-2 sm:py-2.5 rounded-xl bg-gradient-to-r from-purple-600 via-fuchsia-600 to-indigo-600 text-xs font-bold text-white shadow-lg shadow-purple-500/25 hover:shadow-purple-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all cursor-pointer whitespace-nowrap">
                        Save Memory
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
let userEditedTitle = false;

function generateLiveTitle(val) {
    if (userEditedTitle) return;
    const titleInput = document.getElementById('capture-title');
    if (!titleInput) return;
    if (!val || !val.trim()) {
        titleInput.value = '';
        return;
    }
    let clean = val.trim();

    // 1. Author quote extraction (e.g. - Benjamin Franklin)
    const authorMatch = clean.match(/[\n\r\s]+[-—–~]\s*([A-Z][a-zA-Z\s\.]+)/);
    if (authorMatch && authorMatch[1]) {
        const author = authorMatch[1].trim();
        const quoteText = clean.split('\n')[0].replace(/["“”']/g, '').trim();
        const words = quoteText.split(/\s+/);
        const shortQuote = words.length > 5 ? words.slice(0, 5).join(' ') + '...' : quoteText;
        titleInput.value = `"${shortQuote}" - ${author}`;
        return;
    }

    // 2. HTML title tag extraction
    const titleMatch = clean.match(/<title>(.*?)<\/title>/i);
    if (titleMatch && titleMatch[1]) {
        titleInput.value = titleMatch[1].trim().slice(0, 80);
        return;
    }

    // 3. Short 8-word summary
    let firstLine = clean.split('\n')[0].trim();
    firstLine = firstLine.replace(/^[“"'`\s\-*\d\.]+/g, '').replace(/[”"'`\s]+$/g, '').trim();
    if (!firstLine) firstLine = clean.slice(0, 80);
    
    const words = firstLine.split(/\s+/);
    titleInput.value = words.length > 8 ? words.slice(0, 8).join(' ') + '...' : firstLine;
}

function openCapture(catSlug) {
    const el = document.getElementById('capture-overlay');
    if (el) {
        el.classList.remove('hidden');
        if (catSlug) {
            const catSelect = document.getElementById('capture-category');
            if (catSelect) catSelect.value = catSlug;
        }
        document.getElementById('capture-content').focus();
        document.body.style.overflow = 'hidden';
    }
}
function closeCapture() {
    const el = document.getElementById('capture-overlay');
    if (el) {
        el.classList.add('hidden');
        document.body.style.overflow = '';
    }
}
function toggleCaptureDetails() {
    const details = document.getElementById('capture-more-details');
    const icon = document.getElementById('toggle-details-icon');
    const btn = document.getElementById('toggle-details-btn');
    if (!details) return;
    const isHidden = details.classList.contains('hidden');
    if (isHidden) {
        details.classList.remove('hidden');
        if (icon) icon.style.transform = 'rotate(45deg)';
        if (btn) btn.querySelector('span').textContent = 'Hide additional options';
    } else {
        details.classList.add('hidden');
        if (icon) icon.style.transform = '';
        if (btn) btn.querySelector('span').textContent = 'Add tags, author, or link';
    }
}

let suggestTimeout = null;
function onContentChange(value) {
    generateLiveTitle(value);
    suggestCategory(value);
    clearTimeout(suggestTimeout);
    if (value.trim().length < 5) {
        document.getElementById('category-suggestion').classList.add('hidden');
        return;
    }
    suggestTimeout = setTimeout(() => {
        fetch(`{% url 'suggest_category' %}?content=${encodeURIComponent(value)}`)
            .then(r => r.json())
            .then(data => {
                const el = document.getElementById('category-suggestion');
                const catSelect = document.getElementById('capture-category');
                if (data.suggestion) {
                    if (catSelect) catSelect.value = data.suggestion.slug;
                    el.innerHTML = `
                        <div class="slide-up flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-purple-500/15 border border-purple-500/30">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-semibold text-purple-300">✨ Auto-categorized as:</span>
                                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg bg-purple-500/25 text-xs font-semibold text-purple-200">
                                    ${data.suggestion.name}
                                </span>
                            </div>
                            <button type="button" onclick="dismissSuggestion()" class="text-white/40 hover:text-white text-xs px-1 cursor-pointer">✕</button>
                        </div>
                    `;
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                    if (catSelect) {
                        catSelect.value = "{% if active_filter == 'category' %}{{ filter_value }}{% else %}{% endif %}";
                    }
                }
            });
    }, 250);
}

function acceptSuggestion(slug) {
    const catSelect = document.getElementById('capture-category');
    if (catSelect) catSelect.value = slug;
    document.getElementById('category-suggestion').classList.add('hidden');
}

function dismissSuggestion() {
    document.getElementById('category-suggestion').classList.add('hidden');
}

function onCaptureSuccess(event) {
    if (event.detail.successful) {
        document.getElementById('capture-form').reset();
        const details = document.getElementById('capture-more-details');
        if (details) details.classList.add('hidden');
        const icon = document.getElementById('toggle-details-icon');
        if (icon) icon.style.transform = '';
        const btn = document.getElementById('toggle-details-btn');
        if (btn) btn.querySelector('span').textContent = 'Add tags, author, or link';
        document.getElementById('category-suggestion').classList.add('hidden');
        userEditedTitle = false;

        // Remove empty state banner if present
        const emptyStates = document.querySelectorAll('#memory-stream > .col-span-full, #memory-grid > .col-span-full');
        emptyStates.forEach(el => el.remove());

        setTimeout(() => {
            closeCapture();
            const feedback = document.getElementById('capture-feedback');
            if (feedback) feedback.innerHTML = '';
        }, 400);
    }
}

document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        openCapture();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        const overlay = document.getElementById('capture-overlay');
        if (overlay && !overlay.classList.contains('hidden')) {
            e.preventDefault();
            document.getElementById('capture-form')?.requestSubmit();
        }
    }
    if (e.key === 'Escape') {
        closeCapture();
    }
});

function suggestCategory(text) {
    const categorySelect = document.getElementById('capture-category');
    if (!categorySelect || categorySelect.value) return; // Don't override if user already selected
    
    // Existing regex checks for code/quotes/links
    if (text.match(/```[\s\S]*```/)) { categorySelect.value = 'code'; return; }
    if (text.match(/https?:\/\/[^\s]+/)) { categorySelect.value = 'links'; return; }
    if (text.match(/^"[\s\S]*"$/) || text.match(/[\n\r\s]+[-—–~]\s*[A-Z]/)) { categorySelect.value = 'quotes'; return; }

    // Keyword-based suggestions
    const keywords = {
        'tasks': ['todo', 'task', 'need to', 'don\'t forget', 'remember to', 'must', 'should'],
        'watch': ['watch', 'movie', 'film', 'series', 'episode', 'netflix', 'youtube'],
        'read': ['read', 'book', 'article', 'paper', 'chapter', 'novel'],
        'buy': ['buy', 'purchase', 'order', 'shopping', 'price', '₹', '$'],
        'places': ['visit', 'travel', 'restaurant', 'cafe', 'hotel', 'airport', 'trip'],
        'ideas': ['what if', 'idea', 'concept', 'maybe', 'brainstorm'],
        'learn': ['learn', 'study', 'tutorial', 'course', 'how to', 'guide'],
        'reminders': ['reminder', 'appointment', 'meeting', 'deadline', 'schedule'],
    };
    const lower = text.toLowerCase();
    for (const [slug, words] of Object.entries(keywords)) {
        if (words.some(w => lower.includes(w))) {
            const opt = categorySelect.querySelector(`option[value="${slug}"]`);
            if (opt) { categorySelect.value = slug; return; }
        }
    }
}
function onTagInput(value, suggestionsId) {
    const box = document.getElementById(suggestionsId);
    if (!box) return;
    const parts = value.split(',').map(s => s.trim().toLowerCase());
    const currentWord = parts[parts.length - 1];
    const buttons = box.querySelectorAll('.tag-chip-btn');
    
    buttons.forEach(btn => {
        const tagName = btn.getAttribute('data-tag');
        if (parts.includes(tagName)) {
            btn.classList.add('opacity-40');
        } else {
            btn.classList.remove('opacity-40');
        }
        if (!currentWord || tagName.includes(currentWord)) {
            btn.classList.remove('hidden');
        } else {
            btn.classList.add('hidden');
        }
    });
}

function addTagToInput(inputId, tagName, suggestionsId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const parts = input.value.split(',').map(s => s.trim()).filter(Boolean);
    if (!parts.map(p => p.toLowerCase()).includes(tagName.toLowerCase())) {
        parts.push(tagName);
    }
    input.value = parts.join(', ') + ', ';
    if (suggestionsId) onTagInput(input.value, suggestionsId);
    input.focus();
}
</script>
