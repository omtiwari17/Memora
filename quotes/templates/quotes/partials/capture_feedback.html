{# Capture feedback — shown inside the capture modal after form submission #}
{% if success %}
<div class="flex items-center gap-2 text-green-400 slide-up">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span class="text-xs font-medium">Saved to Memora ✓</span>
</div>
{% elif error %}
<div class="flex items-center gap-2 text-red-400 slide-up">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
    <span class="text-xs font-medium">{{ error }}</span>
</div>
{% endif %}
