{# Edit Memory Modal Partial #}
<div id="edit-modal-{{ memory.id }}" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/70 backdrop-blur-md" onclick="closeEditModal('{{ memory.id }}')"></div>

    <!-- Modal Card -->
    <div class="relative w-full max-w-xl max-h-[90vh] flex flex-col modal-glass rounded-3xl shadow-2xl shadow-black/50 overflow-hidden my-auto z-10">
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-white/[0.06] shrink-0 bg-[#0f0e17]/40">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center text-xs">
                    ✏️
                </div>
                <span class="text-sm font-semibold text-white/80">Edit Memory</span>
            </div>
            <button type="button" onclick="closeEditModal('{{ memory.id }}')" class="p-1.5 rounded-lg hover:bg-white/10 transition-colors text-white/40 hover:text-white/70">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Form -->
        <form hx-post="{% url 'memory_edit' memory.id %}" hx-target="#memory-{{ memory.id }}" hx-swap="outerHTML" hx-on::after-request="closeEditModal('{{ memory.id }}')" class="flex flex-col flex-1 overflow-hidden">
            {% csrf_token %}
            <!-- Scrollable Content Body -->
            <div class="px-6 py-4 space-y-4 overflow-y-auto flex-1 max-h-[calc(85vh-120px)]">
                <!-- Content -->
                <div>
                    <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1">Memory Content</label>
                    <textarea
                        name="content"
                        rows="5"
                        class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-3 text-sm text-white/90 placeholder-white/25 outline-none focus:border-purple-400/40 resize-none transition-colors"
                        required
                    >{{ memory.content }}</textarea>
                </div>

                <!-- Title -->
                <div>
                    <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1">Title</label>
                    <input type="text" name="title" value="{{ memory.title }}" placeholder="Title" class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-white/80 placeholder-white/20 outline-none focus:border-purple-400/40 transition-colors">
                </div>

                <!-- Category -->
                <div>
                    <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1">Category</label>
                    <select name="category" class="w-full bg-[#181726] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-purple-400/50 transition-colors appearance-none cursor-pointer" style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22rgba(255,255,255,0.6)%22 stroke-width=%222%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 12px center;">
                        <option value="" class="bg-[#181726] text-white py-2" {% if not memory.category %}selected{% endif %}>📥 No category (Inbox)</option>
                        {% for cat in categories %}
                        <option value="{{ cat.slug }}" class="bg-[#181726] text-white py-2" {% if memory.category and memory.category.id == cat.id %}selected{% endif %}>{{ cat.emoji }} {{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Tags -->
                <div>
                    <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1">Tags (comma separated)</label>
                    <input type="text" name="tags" value="{{ tags_str }}" placeholder="e.g. django, python, bugfix" class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-white/80 placeholder-white/20 outline-none focus:border-purple-400/40 transition-colors">
                </div>

                <!-- URL -->
                <div>
                    <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1">URL / Link</label>
                    <input type="url" name="source_url" value="{{ memory.source_url }}" placeholder="https://..." class="w-full bg-white/[0.03] border border-white/[0.06] rounded-xl px-4 py-2.5 text-sm text-white/80 placeholder-white/20 outline-none focus:border-purple-400/40 transition-colors">
                </div>

                <!-- Priority -->
                <div>
                    <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1">Priority</label>
                    <select name="priority" class="w-full bg-[#181726] border border-white/[0.08] rounded-xl px-4 py-2.5 text-sm text-white outline-none focus:border-purple-400/50 transition-colors appearance-none cursor-pointer" style="background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22rgba(255,255,255,0.6)%22 stroke-width=%222%22%3E%3Cpath d=%22M6 9l6 6 6-6%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right 12px center;">
                        <option value="none" class="bg-[#181726] text-white py-2" {% if memory.priority == 'none' %}selected{% endif %}>⚪ No priority</option>
                        <option value="low" class="bg-[#181726] text-white py-2" {% if memory.priority == 'low' %}selected{% endif %}>🟢 Low</option>
                        <option value="medium" class="bg-[#181726] text-white py-2" {% if memory.priority == 'medium' %}selected{% endif %}>🟡 Medium</option>
                        <option value="high" class="bg-[#181726] text-white py-2" {% if memory.priority == 'high' %}selected{% endif %}>🟠 High</option>
                        <option value="urgent" class="bg-[#181726] text-white py-2" {% if memory.priority == 'urgent' %}selected{% endif %}>🔴 Urgent</option>
                    </select>
                </div>

                <!-- Author -->
                <div>
                    <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1.5">Author</label>
                    <input type="text" name="author" value="{{ memory.author }}" placeholder="Author name" class="w-full h-11 bg-[#181726] border border-white/10 rounded-xl px-4 text-sm text-white placeholder-white/20 outline-none focus:border-purple-500/50 transition-colors">
                </div>

                <!-- Due Date & Status -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1.5">Due Date</label>
                        <input type="date" name="due_date" value="{{ memory.due_date|date:'Y-m-d' }}" class="w-full h-11 bg-[#181726] border border-white/10 rounded-xl px-3 text-sm text-white outline-none focus:border-purple-500/50 transition-colors [color-scheme:dark]">
                    </div>
                    <div>
                        <label class="text-[10px] text-white/40 uppercase font-semibold block mb-1.5">Status</label>
                        <select name="status" class="w-full h-11 bg-[#181726] border border-white/10 rounded-xl px-3 text-sm text-white outline-none focus:border-purple-500/50 transition-colors">
                            <option value="inbox" {% if memory.status == 'inbox' %}selected{% endif %}>📥 Inbox</option>
                            <option value="active" {% if memory.status == 'active' %}selected{% endif %}>✅ Active</option>
                            <option value="done" {% if memory.status == 'done' %}selected{% endif %}>✔️ Done</option>
                            <option value="archived" {% if memory.status == 'archived' %}selected{% endif %}>📦 Archived</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="flex items-center justify-between px-6 py-3.5 border-t border-white/[0.06] bg-[#0f0e17]/80 shrink-0">
                <div></div>
                <div class="flex gap-2">
                    <button type="button" onclick="closeEditModal('{{ memory.id }}')" class="px-4 py-2 rounded-xl text-xs text-white/40 hover:text-white/60 hover:bg-white/5 transition-all">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-xs font-semibold text-white shadow-lg shadow-purple-500/20 hover:shadow-purple-500/35 transition-all">
                        Save Changes
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
function closeEditModal(id) {
    const el = document.getElementById(`edit-modal-${id}`);
    if (el) el.remove();
}
</script>
