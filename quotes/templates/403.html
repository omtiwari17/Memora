<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0a0914] text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Vault Access Restricted | Memora</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'logo.svg' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
    <link rel="shortcut icon" href="{% url 'favicon' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#0a0914">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .aurora-blob {
            position: absolute;
            filter: blur(140px);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.35;
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.04); }
        }
        .animate-float { animation: float-slow 6s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen bg-[#0a0914] text-white flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Dark Aurora Background Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="aurora-blob absolute -top-40 -left-32 w-[600px] h-[600px] bg-amber-600/25"></div>
        <div class="aurora-blob absolute top-1/3 -right-40 w-[650px] h-[650px] bg-purple-600/25"></div>
        <div class="aurora-blob absolute bottom-0 left-1/4 w-[500px] h-[500px] bg-indigo-600/20"></div>
    </div>

    <div class="w-full max-w-lg text-center relative z-10">
        
        <!-- Logo Branding -->
        <a href="{% url 'home_root' %}" class="inline-flex items-center gap-3.5 group mb-8">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-950/90 to-indigo-950/90 border border-purple-400/30 flex items-center justify-center shadow-xl shadow-purple-500/20 group-hover:scale-105 transition-transform">
                <svg class="w-7 h-7" viewBox="0 0 32 32" fill="none">
                    <path d="M7 23V11.5L16 19.5L25 11.5V23" stroke="url(#403-mem-1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M11 10C11 7.79 13.24 6 16 6C18.76 6 21 7.79 21 10" stroke="url(#403-mem-2)" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="16" cy="13.5" r="1.75" fill="#e879f9"/>
                    <defs>
                        <linearGradient id="403-mem-1" x1="7" y1="11.5" x2="25" y2="23" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#c084fc"/>
                            <stop offset="0.5" stop-color="#818cf8"/>
                            <stop offset="1" stop-color="#38bdf8"/>
                        </linearGradient>
                        <linearGradient id="403-mem-2" x1="11" y1="6" x2="21" y2="10" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#f472b6"/>
                            <stop offset="1" stop-color="#c084fc"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="flex flex-col text-left">
                <span class="text-2xl font-bold bg-gradient-to-r from-white via-purple-200 to-indigo-300 bg-clip-text text-transparent">Memora</span>
                <span class="text-[10px] text-white/40 tracking-wider uppercase font-medium">Your memory vault</span>
            </div>
        </a>

        <!-- Glass Card -->
        <div class="glass rounded-3xl p-8 sm:p-12 shadow-2xl shadow-purple-950/40 border border-white/10 space-y-6">
            
            <!-- 403 Hero Number Badge -->
            <div class="inline-flex items-center justify-center">
                <span class="text-7xl sm:text-8xl font-black bg-gradient-to-r from-amber-400 via-purple-300 to-indigo-400 bg-clip-text text-transparent drop-shadow-[0_0_25px_rgba(251,191,36,0.4)] animate-float">
                    403
                </span>
            </div>

            <!-- Error Message -->
            <div class="space-y-2">
                <h1 class="text-2xl sm:text-3xl font-bold text-white">Vault Access Restricted</h1>
                <p class="text-sm text-white/60 leading-relaxed max-w-md mx-auto">
                    You do not have permission to access this memory vault route. Please unlock your personal vault first.
                </p>
            </div>

            <!-- Action Buttons -->
            <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
                <a href="{% url 'login' %}" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-gradient-to-r from-amber-500 to-purple-600 text-xs font-bold text-white shadow-lg shadow-amber-500/25 hover:shadow-amber-500/40 transition-all flex items-center justify-center gap-2 hover:scale-[1.02]">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 00-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                    <span>Unlock Vault</span>
                </a>
                <a href="{% url 'dashboard' %}" class="w-full sm:w-auto px-6 py-3 rounded-2xl glass hover:bg-white/10 text-xs font-semibold text-white/80 border border-white/15 transition-all flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
                    <span>Dashboard</span>
                </a>
            </div>

            <!-- Health Uptime Link -->
            <div class="pt-2 border-t border-white/[0.06]">
                <a href="{% url 'health_check' %}" class="text-[11px] text-white/40 hover:text-emerald-400 transition-colors inline-flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]"></span>
                    <span>Check System Status & Health</span>
                </a>
            </div>

        </div>

        <!-- Footer -->
        <p class="text-xs text-white/30 mt-8">Memora — Personal External Memory System</p>
    </div>

</body>
</html>
